[package]
name = "gaia-cli"
version = "0.2.0-dev"
edition = "2024"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
futures = "0.3"
lexpr = "0.2"
markdown = "1.0.0-alpha.18"

[[bin]]
name = "gaia-cli"
path = "main.rs"
