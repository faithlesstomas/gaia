stages:
  - test
  - build

test:
  stage: test
  image: registry.gitlab.com/debdistutils/guix/container:latest
  before_script:
    # Restore /etc/services manually to resolve HTTP/HTTPS port names in Guix
    - mkdir -p /etc
    - echo "http 80/tcp" > /etc/services
    - echo "https 443/tcp" >> /etc/services
    # Find and authorize substitute signing keys
    - for key in ci.guix.gnu.org.pub bordeaux.guix.gnu.org.pub; do key_path=$(find / -name "$key" 2>/dev/null | head -n 1); if [ -n "$key_path" ]; then mkdir -p /etc/guix && guix archive --authorize < "$key_path"; fi; done
    # Start the Guix daemon if its socket is not present
    - if [ ! -S /var/guix/daemon-socket/socket ]; then guix-daemon --disable-chroot & sleep 5; fi
    # Configure git to trust all directories inside the container to avoid dubious ownership errors
    - git config --global --add safe.directory '*'
  script:
    # Run the integration test suite and dump build logs on failure for debugging
    - guix shell -m guix.scm make -- make check || (echo "=== GUIIX BUILD LOGS ===" && find /var/log/guix/drvs/ -name "*.gz" -exec zcat {} + && exit 1)
    # Generate coverage report and extract HTML/LCOV outputs (lcov is in guix.scm)
    - guix shell -m guix.scm make -- make test-coverage
  coverage: '/TOTAL:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    name: "coverage-report-$CI_COMMIT_REF_SLUG"
    paths:
      - coverage-html/
      - coverage.info
      - "*.log"
    expire_in: 1 week

build:
  stage: build
  image: registry.gitlab.com/debdistutils/guix/container:latest
  before_script:
    - mkdir -p /etc
    - echo "http 80/tcp" > /etc/services
    - echo "https 443/tcp" >> /etc/services
    - for key in ci.guix.gnu.org.pub bordeaux.guix.gnu.org.pub; do key_path=$(find / -name "$key" 2>/dev/null | head -n 1); if [ -n "$key_path" ]; then mkdir -p /etc/guix && guix archive --authorize < "$key_path"; fi; done
    - if [ ! -S /var/guix/daemon-socket/socket ]; then guix-daemon --disable-chroot & sleep 5; fi
    - git config --global --add safe.directory '*'
  script:
    # Build the Rust CLI binary in release mode and dump build logs on failure
    - guix shell -m guix.scm -- cargo build --manifest-path src/gaia-cli/Cargo.toml --release || (echo "=== GUIIX BUILD LOGS ===" && find /var/log/guix/drvs/ -name "*.gz" -exec zcat {} + && exit 1)
  artifacts:
    name: "gaia-cli-$CI_COMMIT_REF_SLUG"
    paths:
      - src/gaia-cli/target/release/gaia
    expire_in: 1 week
