stages:
  - test
  - coverage
  - build

# Guile's regexp/string indices must use the same UTF-8 character semantics.
# The container otherwise defaults to the byte-oriented C locale, which makes
# prompt slicing fail on characters such as em dashes and ≥.
variables:
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"

.guix_setup: &guix_setup
  before_script:
    # Restore /etc/services manually to resolve HTTP/HTTPS port names in Guix
    - mkdir -p /etc
    - echo "http 80/tcp" > /etc/services
    - echo "https 443/tcp" >> /etc/services
    # Find and authorize substitute signing keys
    - for key in ci.guix.gnu.org.pub bordeaux.guix.gnu.org.pub; do key_path=$(find / -name "$key" 2>/dev/null | head -n 1); if [ -n "$key_path" ]; then mkdir -p /etc/guix && guix archive --authorize < "$key_path"; fi; done
    # Start the Guix daemon if its socket is not present
    - if [ ! -S /var/guix/daemon-socket/socket ]; then guix-daemon --disable-chroot & sleep 5; fi
    # Configure git to trust all directories inside the container to avoid dubious ownership errors
    - git config --global --add safe.directory '*'

test:
  stage: test
  image: registry.gitlab.com/debdistutils/guix/container:latest
  timeout: 15 minutes
  interruptible: true
  <<: *guix_setup
  script:
    # Each suite runs in a fresh process with its own timeout (see run-coverage.scm).
    # Test logs are uploaded as artifacts, so avoid dumping every Guix build log.
    - GAIA_TEST_TIMEOUT=120 guix shell -m guix.scm make -- make check
    # Enforce the Scheme side of the GCAS contract. Client adapters have their
    # own lightweight jobs below.
    - guix shell -m guix.scm make -- make gcas-conformance-scheme
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - .gitlab-ci.yml
        - Makefile
        - guix.scm
        - scripts/**/*.scm
        - src/gaia/**/*.scm
        - tests/**/*.scm
  artifacts:
    name: "test-logs-$CI_COMMIT_REF_SLUG"
    paths:
      - "*.log"
    expire_in: 1 week

emacs-client:
  stage: test
  image: silex/emacs:30.2-alpine-ci
  timeout: 5 minutes
  interruptible: true
  script:
    - make test-emacs-client
  rules:
    - changes:
        - .gitlab-ci.yml
        - Makefile
        - src/gaia-desktop/emacs/**/*
        - tests/test-emacs-client.el

coverage:
  stage: coverage
  image: registry.gitlab.com/debdistutils/guix/container:latest
  timeout: 30 minutes
  interruptible: true
  <<: *guix_setup
  script:
    # Run coverage report (lcov is included in guix.scm manifest)
    - guix shell -m guix.scm make -- make test-coverage
  coverage: '/TOTAL:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    name: "coverage-report-$CI_COMMIT_REF_SLUG"
    paths:
      - coverage-html/
      - coverage.info
      - "*.log"
    expire_in: 1 week
  only:
    - main

build:
  stage: build
  image: rust:latest
  timeout: 15 minutes
  interruptible: true
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  cache:
    key:
      files:
        - src/gaia-cli/Cargo.lock
    paths:
      - .cargo/registry/
      - .cargo/git/
      - src/gaia-cli/target/
    policy: pull-push
  script:
    # Keep the Rust protocol adapter formatted and covered before packaging it.
    - cargo fmt --manifest-path src/gaia-cli/Cargo.toml -- --check
    - cargo test --manifest-path src/gaia-cli/Cargo.toml
    # Build the Rust CLI binary in release mode using official Rust container.
    - cargo build --manifest-path src/gaia-cli/Cargo.toml --release
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - .gitlab-ci.yml
        - src/gaia-cli/**/*
  artifacts:
    name: "gaia-cli-$CI_COMMIT_REF_SLUG"
    paths:
      - src/gaia-cli/target/release/gaia
    expire_in: 1 week
