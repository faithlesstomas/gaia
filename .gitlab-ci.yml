stages:
  - test
  - build

test:
  stage: test
  image: registry.gitlab.com/debdistutils/guix/container:latest
  before_script:
    # Install netbase to restore /etc/services for DNS resolution in Guix
    - apt-get update && apt-get install -y netbase
    # Start the Guix daemon if its socket is not present
    - if [ ! -S /var/guix/daemon-socket/socket ]; then guix-daemon --disable-chroot & sleep 5; fi
  script:
    # Run the integration test suite
    - guix shell -m guix.scm make -- make check
    # Generate coverage report and extract HTML/LCOV outputs
    - guix shell -m guix.scm make lcov -- make test-coverage
  coverage: '/TOTAL:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    name: "coverage-report-$CI_COMMIT_REF_SLUG"
    paths:
      - coverage-html/
      - coverage.info
      - "*.log"
    expire_in: 1 week

build:
  stage: build
  image: registry.gitlab.com/debdistutils/guix/container:latest
  before_script:
    - apt-get update && apt-get install -y netbase
    - if [ ! -S /var/guix/daemon-socket/socket ]; then guix-daemon --disable-chroot & sleep 5; fi
  script:
    # Build the Rust CLI binary in release mode
    - guix shell -m guix.scm -- cargo build --manifest-path src/gaia-cli/Cargo.toml --release
  artifacts:
    name: "gaia-cli-$CI_COMMIT_REF_SLUG"
    paths:
      - src/gaia-cli/target/release/gaia
    expire_in: 1 week
